name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'admin/**'
      - 'admin-index.html'
      - 'firebase.json'
      - '404.html'
      - 'assets/**'
      - '.github/workflows/firebase-hosting-merge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RISTORANTE_ROSSINI }}
          projectId: ristorante-rossini
          firebaseToolsVersion: 14.22.0
          channelId: live
